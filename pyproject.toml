[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projectclarity"
version = "0.1.0"
description = "Source-linked research with inspectable evidence and model usage."
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
projectclarity = "projectclarity.ux.web_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
projectclarity = ["**/README.md", "prompts/*.txt", "ux/pages/*.html", "ux/scripts/*.js", "ux/styles/*.css"]
